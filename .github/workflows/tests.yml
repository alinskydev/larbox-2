name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: larbox_2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, exif, gd, intl, mbstring, pdo_pgsql, pgsql, zip
          coverage: none

      - name: Prepare databases
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -d larbox_2 -c 'CREATE EXTENSION pg_trgm'
          psql -c 'CREATE DATABASE larbox_2_history'
          psql -c 'CREATE DATABASE larbox_2_telescope'

      # larbox:test is allowed only with APP_ENV=local; phpunit.xml switches tests to "testing"
      - name: Create .env
        run: |
          cat > .env << 'EOF'
          APP_ID=1
          APP_NAME="Larbox 2"
          APP_KEY=
          APP_URL=http://127.0.0.1:8000
          APP_ENV=local
          APP_DEBUG=false
          APP_TIMEZONE=Asia/Tashkent
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en

          LOG_CHANNEL=database
          LOG_LEVEL=debug

          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          SESSION_DRIVER=array
          TELESCOPE_ENABLED=false
          TESTING_SHOW_DETAILED_ERROR=false
          PHP_CLI_SERVER_WORKERS=4

          DB_MAIN_CONNECTION=main
          DB_MAIN_HOST=127.0.0.1
          DB_MAIN_PORT=5432
          DB_MAIN_DATABASE=larbox_2
          DB_MAIN_SCHEMA=public
          DB_MAIN_USERNAME=postgres
          DB_MAIN_PASSWORD=postgres

          DB_HISTORY_HOST=127.0.0.1
          DB_HISTORY_PORT=5432
          DB_HISTORY_DATABASE=larbox_2_history
          DB_HISTORY_SCHEMA=public
          DB_HISTORY_USERNAME=postgres
          DB_HISTORY_PASSWORD=postgres

          DB_TELESCOPE_HOST=127.0.0.1
          DB_TELESCOPE_PORT=5432
          DB_TELESCOPE_DATABASE=larbox_2_telescope
          DB_TELESCOPE_SCHEMA=public
          DB_TELESCOPE_USERNAME=postgres
          DB_TELESCOPE_PASSWORD=postgres

          STORE_URL=${APP_URL}/emulator/store
          STORE_USERNAME=ci
          STORE_PASSWORD=ci
          STORAGE_URL=${APP_URL}/emulator/storage
          STORAGE_SECRET_KEY=ci
          TELEGRAM_BOT_KEY=ci
          TELEGRAM_BOT_URL=${APP_URL}/emulator/telegram
          TELEGRAM_BOT_SECRET_TOKEN=ci
          TELEGRAM_BOT_DEV_CHAT_IDS=1
          EOF

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      # Integrations call emulators over real HTTP (STORE_URL, STORAGE_URL, TELEGRAM_BOT_URL)
      # Server and tests run as root: FileHelper does chown(..., 'www-data')
      - name: Start server for emulators
        run: sudo php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &

      - name: Run tests
        run: sudo php artisan larbox:test

      - name: Show server log
        if: failure()
        run: cat storage/logs/serve.log
